services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    init: true
    shm_size: 256mb
    environment:
      TZ: Europe/Kyiv
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${METRICS_PORT:-8080}:${METRICS_PORT:-8080}"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('METRICS_PORT', '8080') + '/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  postgres:
    image: docker.io/library/postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: monitor
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: Europe/Kyiv
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitor"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres-data:
